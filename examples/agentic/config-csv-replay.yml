data:
  type: agentic_csv
  agentic_csv:
    path: ./examples/agentic/sample_trace.csv

load:
  type: agentic
  session_arrival:
    type: constant
    stages:
    - rate: 5
      duration: 120
    - rate: 10
      duration: 120
  agentic:
    tool_call_delay:
      type: zero
    user_think_delay:
      type: zero

api:
  type: chat
server:
  type: vllm
  model_name: meta-llama/Llama-3-8B-Instruct
  base_url: http://localhost:8000

report:
  request_lifecycle:
    summary: true
    session_summary: true
    per_turn_position: true
