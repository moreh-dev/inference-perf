apiVersion: v1
kind: Secret
metadata:
  name: hf-secret
  namespace: mif
type: Opaque
stringData:
  hf_api_token: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-shared-prefix-config
  namespace: mif
data:
  config.yml: |
    load:
      type: poisson
      interval: 0 
      stages:
      - rate: 46
        duration: 2
      - rate: 3.0
        duration: 20
      - rate: 10.0
        duration: 20
      num_workers: 2
      worker_max_concurrency: 50
      worker_max_tcp_connections: 2500
      request_timeout: 1200.0
    api:
      type: chat
      streaming: true
    server:
      type: vllm
      model_name: Qwen/Qwen3-32B
      base_url: http://mif-istio.mif.svc.cluster.local:80
      ignore_eos: true
    data:
      type: shared_prefix
      shared_prefix:
        num_groups: 230       
        num_prompts_per_group: 5   
        system_prompt_len: 8000       
        question_len: 1000             
        output_len: 1000       
    metrics:
      type: prometheus
      prometheus:
        url: http://prometheus-operated.prometheus-stack.svc.cluster.local:9090
        scrape_interval: 15
        filters:
        - namespace="bongwoo"
        - job=~"bongwoo/(pd-prefill|pd-decode)"
        - pod=~"pd-(prefill|decode)-.*"
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf-shared-prefix2
  namespace: mif
  labels:
    app: inference-perf
    benchmark: shared-prefix
spec:
  template:
    metadata:
      labels:
        app: inference-perf
        benchmark: shared-prefix
    spec:
      containers:
        - name: inference-perf
          image: 192.168.212.30:1780/moreh/inference-perf:shared-prefix-chat-6 
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              inference-perf --config_file /etc/config/config.yml
              echo "[INFO] Benchmark completed. Keeping container alive..."
              sleep infinity
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: config-volume
          configMap:
            name: inference-perf-shared-prefix-config

