load:
  type: poisson
  stages:
    - rate: 5
      duration: 30
    - rate: 20
      duration: 30
    - rate: 20
      duration: 30
    - rate: 30
      duration: 30
    - rate: 40
      duration: 30
    - rate: 50
      duration: 30
    - rate: 60
      duration: 30
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: Qwen/Qwen3-32B
  base_url: http://172.31.182.46:80
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen3-32B
data:
  type: shared_prefix
  shared_prefix:
    num_groups: 150               # Number of distinct shared prefixes
    num_prompts_per_group: 5      # Number of unique questions per shared prefix
    system_prompt_len: 6000       # Length of the shared prefix (in tokens)
    question_len: 1200            # Length of the unique question part (in tokens)
    output_len: 1000              # Target length for the model's generated output (in tokens)
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
storage:
  local_storage:
    path: /workspace
